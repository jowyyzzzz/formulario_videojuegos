<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscripción Torneo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<form action="#" method="post">
  <h1>Inscripción al Torneo</h1>

  <fieldset>
    <legend>Datos personales</legend>

    <div class="field">
      <label for="full-name">Nombre completo *</label>
      <input type="text" id="full-name" name="full-name" required minlength="3">
    </div>

    <div class="field">
      <label for="email">Correo electrónico *</label>
      <input type="email" id="email" name="email" required>
    </div>

    <div class="field">
      <label for="age">Edad *</label>
      <input type="number" id="age" name="age" min="16" required>
    </div>

    <div class="field">
      <label for="birthdate">Fecha de nacimiento</label>
      <input type="date" id="birthdate" name="birthdate">
    </div>
  </fieldset>

  <fieldset>
    <legend>Cuenta de jugador</legend>

    <div class="field">
      <label for="nickname">Nickname *</label>
      <input type="text" id="nickname" name="nickname" required minlength="3" maxlength="15">
    </div>

    <div class="field">
      <label for="password">Contraseña *</label>
      <input type="password" id="password" name="password" required minlength="6">
    </div>
  </fieldset>

  <fieldset>
    <legend>Torneo</legend>

    <div class="field">
      <label for="game">Videojuego</label>
      <select id="game" name="game">
        <option value="valorant">Valorant</option>
        <option value="lol">Gta 5 roleplay</option>
        <option value="cs2">CSGO</option>
        <option value="fortnite">Fortnite</option>
        <option value="fifa">Rob run</option>
      </select>
    </div>

    <div class="field">
      <label>Plataforma</label>
      <div class="radio-group">
        <label><input type="radio" name="platform" value="pc" checked> PC</label>
        <label><input type="radio" name="platform" value="playstation"> PlayStation</label>
        <label><input type="radio" name="platform" value="xbox"> Xbox</label>
      </div>
    </div>

    <div class="field">
      <label>Disponibilidad</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="availability" value="morning"> Mañana</label>
        <label><input type="checkbox" name="availability" value="afternoon"> Tarde</label>
        <label><input type="checkbox" name="availability" value="night"> Noche</label>
      </div>
    </div>

    <div class="field">
      <label for="comments">Comentarios adicionales</label>
      <textarea id="comments" name="comments"></textarea>
    </div>
  </fieldset>

  <div class="field terms">
    <input type="checkbox" id="accept-terms" name="accept-terms" required>
    <label for="accept-terms">Acepto las <a href="reglas.html" target="_blank">normas del torneo</a> *</label>
  </div>

  <div class="field">
    <button type="submit">Inscribirme</button>
    <button type="reset">Limpiar formulario</button>
  </div>
</form>

</body>
</html>
